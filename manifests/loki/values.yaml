deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  common:
    path_prefix: /var/loki

  limits_config:
    retention_period: 360h
    allow_structured_metadata: true
    volume_enabled: true

  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /var/loki/compactor

  rulerConfig:
    enable_api: true

  storage_config:
    filesystem:
      directory: /var/loki/chunks

# Chart defaults size these memcached caches for a much bigger cluster
# (chunksCache alone defaults to 8Gi) — on this 2-node homelab cluster
# that was reserving ~68% of the worker node's total memory via requests,
# leaving no headroom to schedule anything else even though actual usage
# was nowhere near that. Trimmed to sane sizes for our log volume.
resultsCache:
  allocatedMemory: 256
  allocatedCPU: 100m

chunksCache:
  allocatedMemory: 512
  allocatedCPU: 100m

singleBinary:
  replicas: 1

  service:
    type: LoadBalancer
    port: 3100

  persistence:
    enabled: true
    storageClass: local-path
    accessModes:
      - ReadWriteOnce
    size: 30Gi

# Disable the other deployment modes

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomPlanner:
  replicas: 0

bloomBuilder:
  replicas: 0

bloomGateway:
  replicas: 0

gateway:
  enabled: false

minio:
  enabled: false

lokiCanary:
  enabled: true

test:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false

  dashboards:
    enabled: false

  rules:
    enabled: false

  serviceMonitor:
    enabled: false
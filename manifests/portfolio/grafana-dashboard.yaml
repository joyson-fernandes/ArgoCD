apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-app-metrics-dashboard
  namespace: portfolio
  labels:
    grafana_dashboard: "1"
data:
  portfolio-app-metrics.json: |
    {
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "targets": [
            {
              "expr": "sum(rate(portfolio_http_requests_total[5m])) by (route, namespace)",
              "legendFormat": "{{namespace}} - {{route}}",
              "refId": "A"
            }
          ],
          "title": "HTTP Request Rate",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "targets": [
            {
              "expr": "sum(rate(portfolio_http_requests_total{status=~\"5..\"}[5m])) by (route, namespace)",
              "legendFormat": "{{namespace}} - {{route}}",
              "refId": "A"
            }
          ],
          "title": "Error Rate (5xx)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(portfolio_http_request_duration_seconds_bucket[5m])) by (le, route, namespace))",
              "legendFormat": "{{namespace}} - {{route}}",
              "refId": "A"
            }
          ],
          "title": "Request Latency (p95)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 4,
          "targets": [
            {
              "expr": "sum(rate(portfolio_external_api_calls_total[5m])) by (target, status, namespace)",
              "legendFormat": "{{namespace}} - {{target}} ({{status}})",
              "refId": "A"
            }
          ],
          "title": "External API Health",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "id": 5,
          "targets": [
            {
              "expr": "sum(rate(portfolio_project_link_clicks_total[1h])) by (project, namespace)",
              "legendFormat": "{{namespace}} - {{project}}",
              "refId": "A"
            }
          ],
          "title": "Project Link Clicks",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "id": 6,
          "targets": [
            {
              "expr": "sum(rate(portfolio_guide_views_total[1h])) by (slug, namespace)",
              "legendFormat": "{{namespace}} - {{slug}}",
              "refId": "A"
            }
          ],
          "title": "Guide Views",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "max": 100,
              "min": 0,
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "id": 7,
          "targets": [
            {
              "expr": "sum(rate(portfolio_quiz_score_percent_sum[1h])) by (cert_id, namespace) / sum(rate(portfolio_quiz_score_percent_count[1h])) by (cert_id, namespace)",
              "legendFormat": "{{namespace}} - {{cert_id}}",
              "refId": "A"
            }
          ],
          "title": "Average Quiz Score",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "max": 1,
              "min": 0,
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "id": 8,
          "targets": [
            {
              "expr": "sum(rate(portfolio_cache_hits_total[15m])) by (key, namespace) / (sum(rate(portfolio_cache_hits_total[15m])) by (key, namespace) + sum(rate(portfolio_cache_misses_total[15m])) by (key, namespace))",
              "legendFormat": "{{namespace}} - {{key}}",
              "refId": "A"
            }
          ],
          "title": "Cache Hit Ratio",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 32
          },
          "id": 9,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "portfolio_build_info",
              "instant": true,
              "legendFormat": "{{namespace}} - {{git_sha}}",
              "refId": "A"
            }
          ],
          "title": "Running Version",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "dateTimeFromNow"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 32
          },
          "id": 10,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "portfolio_deploy_timestamp_seconds * 1000",
              "instant": true,
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "title": "Time Since Deploy",
          "type": "stat"
        }
      ],
      "refresh": "30s",
      "tags": [
        "portfolio"
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Portfolio App Metrics",
      "uid": "portfolio-app-metrics",
      "version": 2
    }

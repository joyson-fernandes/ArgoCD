apiVersion: v1
kind: Namespace
metadata:
  name: portfolio-dev
  labels:
    app: portfolio
    team: personal
    env: dev

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-app
  namespace: portfolio-dev
  labels:
    app: portfolio-app
    team: personal
    env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-app
  template:
    metadata:
      labels:
        app: portfolio-app
        team: personal
        env: dev
    spec:
      containers:
        - name: portfolio-app
          image: ghcr.io/joyson-fernandes/portfolio-website:e99f201
          ports:
            - containerPort: 3000
              name: http

          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-app
  namespace: portfolio-dev
  labels:
    app: portfolio-app
spec:
  type: ClusterIP
  selector:
    app: portfolio-app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: portfolio-app
  namespace: portfolio-dev
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: portfolio-app
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dev-joysonfernandes-com
  namespace: portfolio-dev
spec:
  secretName: dev-joysonfernandes-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - dev.joysonfernandes.com

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio-dev
  namespace: portfolio-dev
spec:
  entryPoints:
    - websecure

  routes:
    - kind: Rule
      match: Host(`dev.joysonfernandes.com`)
      services:
        - name: portfolio-app
          port: 80

  tls:
    secretName: dev-joysonfernandes-com-tls

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: portfolio-dev
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio-dev-redirect
  namespace: portfolio-dev
spec:
  entryPoints:
    - web

  routes:
    - kind: Rule
      match: Host(`dev.joysonfernandes.com`)
      middlewares:
        - name: redirect-https
      services:
        - name: portfolio-app
          port: 80

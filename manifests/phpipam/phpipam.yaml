apiVersion: v1
kind: Namespace
metadata:
  name: phpipam
  labels:
    app: phpipam

---
# Dedicated MariaDB for phpIPAM — same lightweight pattern as other
# single-app databases in this repo (plain StatefulSet + PVC, no
# operator/HA). phpIPAM only speaks MySQL/MariaDB; the shared CNPG
# cluster is Postgres-only, so this stays standalone.
#
# phpipam-db secret is decrypted in-cluster by the Sealed Secrets
# controller (kube-system) from db-sealedsecret.yaml in this directory.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: phpipam-db
  namespace: phpipam
  labels:
    app: phpipam-db
spec:
  serviceName: phpipam-db
  replicas: 1
  selector:
    matchLabels:
      app: phpipam-db
  template:
    metadata:
      labels:
        app: phpipam-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: phpipam-db
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 3Gi

---
apiVersion: v1
kind: Service
metadata:
  name: phpipam-db
  namespace: phpipam
spec:
  clusterIP: None
  selector:
    app: phpipam-db
  ports:
    - port: 3306
      targetPort: mysql

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpipam-www
  namespace: phpipam
  labels:
    app: phpipam-www
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpipam-www
  template:
    metadata:
      labels:
        app: phpipam-www
    spec:
      containers:
        - name: phpipam-www
          image: phpipam/phpipam-www:latest
          ports:
            - containerPort: 80
              name: http
          env:
            - name: IPAM_DATABASE_HOST
              value: phpipam-db
            - name: IPAM_DATABASE_WEBHOST
              value: "%"
            - name: TZ
              value: "Europe/London"
          envFrom:
            - secretRef:
                name: phpipam-db
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      initContainers:
        - name: wait-for-db
          image: mariadb:11
          command:
            - sh
            - -c
            - until mysqladmin ping -h phpipam-db --silent; do sleep 2; done

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpipam-cron
  namespace: phpipam
  labels:
    app: phpipam-cron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpipam-cron
  template:
    metadata:
      labels:
        app: phpipam-cron
    spec:
      containers:
        - name: phpipam-cron
          image: phpipam/phpipam-cron:latest
          env:
            - name: IPAM_DATABASE_HOST
              value: phpipam-db
            - name: SCAN_INTERVAL
              value: "1h"
            - name: TZ
              value: "Europe/London"
          envFrom:
            - secretRef:
                name: phpipam-db
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      initContainers:
        - name: wait-for-db
          image: mariadb:11
          command:
            - sh
            - -c
            - until mysqladmin ping -h phpipam-db --silent; do sleep 2; done

---
apiVersion: v1
kind: Service
metadata:
  name: phpipam-www
  namespace: phpipam
  labels:
    app: phpipam-www
spec:
  type: ClusterIP
  selector:
    app: phpipam-www
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ipam-joysontech-com
  namespace: phpipam
spec:
  secretName: ipam-joysontech-com-tls
  issuerRef:
    name: letsencrypt-dns01-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - ipam.joysontech.com

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-only
  namespace: phpipam
spec:
  ipAllowList:
    sourceRange:
      - 10.0.0.0/8

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: phpipam
  namespace: phpipam
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`ipam.joysontech.com`)
      middlewares:
        - name: internal-only
      services:
        - name: phpipam-www
          port: 80
  tls:
    secretName: ipam-joysontech-com-tls

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: phpipam
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: phpipam-redirect
  namespace: phpipam
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`ipam.joysontech.com`)
      middlewares:
        - name: internal-only
        - name: redirect-https
      services:
        - name: phpipam-www
          port: 80

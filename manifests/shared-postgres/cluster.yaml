apiVersion: v1
kind: Namespace
metadata:
  name: shared-postgres
  labels:
    app: shared-postgres

---
# Consolidates the separate plain-Postgres StatefulSets that Umami and
# interview-prep each got (the lightest option available before this
# operator existed on prod-k8s). instances: 1, not 3 — this cluster only
# has 2 nodes, not enough for real anti-affinity-backed HA, so this
# trades HA for CNPG's declarative multi-database provisioning, native
# backups, and built-in Prometheus metrics, none of which the plain
# StatefulSets had.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-postgres
  namespace: shared-postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  storage:
    size: 10Gi
    storageClass: local-path
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: umami
  namespace: shared-postgres
spec:
  name: umami
  owner: umami
  cluster:
    name: shared-postgres

---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: prep
  namespace: shared-postgres
spec:
  name: prep
  owner: prep
  cluster:
    name: shared-postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: umami
  namespace: shared-postgres
spec:
  name: umami
  cluster:
    name: shared-postgres
  login: true
  passwordSecret:
    name: umami-db-role
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: prep
  namespace: shared-postgres
spec:
  name: prep
  cluster:
    name: shared-postgres
  login: true
  passwordSecret:
    name: prep-db-role
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: umami-db-role
  namespace: shared-postgres
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: umami-db-role
      namespace: shared-postgres
    type: kubernetes.io/basic-auth
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: prep-db-role
  namespace: shared-postgres
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: prep-db-role
      namespace: shared-postgres
    type: kubernetes.io/basic-auth

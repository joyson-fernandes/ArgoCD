# The IaC runner takes SSH keys and runs playbooks on request, with no sign-in of
# its own: only RMM server copies may reach it. Egress stays open (git clones and
# SSH to the customer's hosts).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rmm-iac-runner
  namespace: rmm
  labels:
    app: rmm
    team: platform
    env: production
spec:
  podSelector:
    matchLabels:
      app: rmm-iac-runner
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: rmm
              component: server
      ports:
        - protocol: TCP
          port: 8099

---
# The template-check pod runs untrusted CloudFormation templates through cfn-lint and cfn-guard: only RMM server copies
# may reach it, and it may reach nothing (no egress rule, so DNS and everything else is denied).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rmm-cloud-checks
  namespace: rmm
  labels:
    app: rmm
    team: platform
    env: production
spec:
  podSelector:
    matchLabels:
      app: rmm-cloud-checks
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: rmm
              component: server
      ports:
        - protocol: TCP
          port: 8099
  egress: []

---
# The AI agent runner runs agent graphs and handles the text of emails and web
# pages. Only RMM server copies may call it, and it may call only: DNS, the
# server's agent listener (8097, which holds every secret and applies the
# per-agent limits) and its own checkpoint database (the primary of rmm-db).
# Nothing else, so nothing on the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rmm-agent-runner
  namespace: rmm
  labels:
    app: rmm
    team: platform
    env: production
spec:
  podSelector:
    matchLabels:
      app: rmm-agent-runner
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: rmm
              component: server
      ports:
        - protocol: TCP
          port: 8098
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: rmm
              component: server
      ports:
        - protocol: TCP
          port: 8097
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: rmm-db
              cnpg.io/instanceRole: primary
      ports:
        - protocol: TCP
          port: 5432

---
# NATS (apps/nats-rmm.yaml): the client port only for RMM copies, routes only
# between the NATS servers, the agent WebSocket only through Traefik
# (TLS passthrough), metrics only for Prometheus. Kubelet probes on the monitor
# port come from the node and are allowed by Cilium.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rmm-nats
  namespace: rmm
  labels:
    app: rmm
    team: platform
    env: production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/instance: rmm-nats
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: rmm
              component: server
      ports:
        - protocol: TCP
          port: 4222
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
              app.kubernetes.io/instance: rmm-nats
      ports:
        - protocol: TCP
          port: 6222
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 4443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 7777

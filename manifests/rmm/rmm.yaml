apiVersion: v1
kind: Namespace
metadata:
  name: rmm
  labels:
    app: rmm
    team: platform
    env: production

---
# Dedicated Postgres for the RMM server (isolated from shared-postgres).
# Three instances on three nodes: one primary, two standbys. A commit waits for
# one standby (quorum), so a fail-over loses no committed data, yet writes go on
# when a standby is down (dataDurability: preferred). RMM copies send request
# traffic through the Pooler (rmm-db-pooler-rw) and use rmm-db-rw directly for
# the leader lock, the list of copies and migrations.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rmm-db
  namespace: rmm
  labels:
    app: rmm
    team: platform
    env: production
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  enableSuperuserAccess: false
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  bootstrap:
    initdb:
      database: rmm
      owner: rmm
      encoding: UTF8
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  # One replica per worker (w01, w02, w03); w02 also runs practice VMs; when a
  # worker is down, one replica waits (the other two keep quorum).
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  inheritedMetadata:
    labels:
      app: rmm-db
      team: platform
      env: production
  # Offsite database backups come later (R2 bucket).
  storage:
    storageClass: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

---
# PgBouncer in front of rmm-db for request traffic. Transaction pooling; pgx's
# prepared statements are carried by PgBouncer's protocol-level support
# (max_prepared_statements). Session features (the leader's advisory lock) use
# the direct rmm-db-rw service instead.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: rmm-db-pooler-rw
  namespace: rmm
  labels:
    app: rmm
    team: platform
    env: production
spec:
  cluster:
    name: rmm-db
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "500"
      default_pool_size: "20"
      max_prepared_statements: "200"
  template:
    metadata:
      labels:
        app: rmm-db-pooler
        team: platform
        env: production
    spec:
      containers: []
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              cnpg.io/poolerName: rmm-db-pooler-rw

---
# The AI agent runner's checkpoint database and its own login on rmm-db
# (docs/runbooks/ai-agents-first-live-check.md, section A). The role owns only
# rmm_agents and has no grant on rmm. Password: SealedSecret rmm-agent-runner-db.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: rmm-agent-runner
  namespace: rmm
  labels:
    app: rmm-agent-runner
    team: platform
    env: production
spec:
  name: rmm_agent_runner
  cluster:
    name: rmm-db
  login: true
  passwordSecret:
    name: rmm-agent-runner-db

---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: rmm-agents
  namespace: rmm
  labels:
    app: rmm-agent-runner
    team: platform
    env: production
spec:
  name: rmm_agents
  owner: rmm_agent_runner
  cluster:
    name: rmm-db

---
# The stand-alone server's volume (CA, generated TLS, embedded NATS, releases).
# Cluster copies no longer mount it. KEEP it until the cut-over is proven and the
# CA and secrets key are sealed (rollout step 4 removes it): with local-path the
# reclaim policy is Delete, so pruning it destroys the only copy of /data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rmm-data
  namespace: rmm
  labels:
    app: rmm
    team: platform
    env: production
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi

---
# Database migrations run once per deploy, before any copy rolls (native ArgoCD
# PreSync hook). Migrations must stay backwards compatible for one release,
# because old and new copies run side by side during a roll.
apiVersion: batch/v1
kind: Job
metadata:
  name: rmm-migrate
  namespace: rmm
  labels:
    app: rmm-migrate
    team: platform
    env: production
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: rmm-migrate
        team: platform
        env: production
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/joyson-fernandes/rmm-server:c39de45
          args: ["migrate"]
          env:
            # Direct connection: migrations queue on an advisory lock.
            - name: RMM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rmm-db-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmm-server
  namespace: rmm
  labels:
    app: rmm
    team: platform
    env: production
spec:
  # Steady state (Stage B, second commit). The first cluster commit used
  # Recreate + 1 replica so the stand-alone pod stopped before any copy started.
  replicas: 3
  # No copy goes down before its replacement is ready.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: rmm
  template:
    metadata:
      labels:
        app: rmm
        component: server
        team: platform
        env: production
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      automountServiceAccountToken: false
      # Must exceed preStop (10s) + the server's cluster-mode shutdown grace
      # (RMM_SHUTDOWN_GRACE, default 55s), with margin, or a draining copy is killed.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread over the workers (w01, w02, w03); w02 also runs practice VMs;
      # when a worker is down, the copies run on the other two.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          # Count only pods of the same version, so a roll never stacks two new copies on one worker.
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: rmm
              component: server
      containers:
        - name: rmm-server
          image: ghcr.io/joyson-fernandes/rmm-server:c39de45
          ports:
            - containerPort: 8080
              name: http
          env:
            # --- cluster mode -------------------------------------------------
            - name: RMM_CLUSTER
              value: "true"
            - name: RMM_COPY_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RMM_CA_DIR
              value: /etc/rmm/ca
            - name: RMM_SECRETS_KEY_FILE
              value: /etc/rmm/secrets/secrets.key
            # The NATS client port presents a certificate from the RMM CA.
            # RMM_NATS_CA_FILE needs an RMM image at or after the always-on merge
            # (older images ignore it and cannot verify NATS over tls://).
            - name: RMM_NATS_URL
              value: tls://rmm-nats.rmm.svc.cluster.local:4222
            - name: RMM_NATS_CA_FILE
              value: /etc/rmm/ca/ca.crt
            - name: RMM_NATS_CREDS
              value: /etc/rmm/nats/service.nk
            - name: RMM_NATS_CALLOUT_SEED
              value: /etc/rmm/nats/callout.seed
            - name: RMM_NATS_PUBLIC_URL
              value: wss://rmm-agents.joysontech.com
            - name: RMM_RELEASES_FROM_DB
              value: "true"
            # Required by the settings check; a copy writes nothing to it.
            - name: RMM_DATA_DIR
              value: /tmp/rmm
            # --- database -----------------------------------------------------
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rmm-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rmm-db-app
                  key: password
            # Request traffic through PgBouncer.
            - name: RMM_DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@rmm-db-pooler-rw.rmm.svc:5432/rmm?sslmode=require
            # Leader lock, list of copies: straight to the primary.
            - name: RMM_DATABASE_DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: rmm-db-app
                  key: uri
            # --- unchanged --------------------------------------------------------
            - name: RMM_HTTP_ADDR
              value: ":8080"
            - name: RMM_PUBLIC_URL
              value: https://rmm.joysontech.com
            - name: RMM_ALLOWED_ORIGINS
              value: https://rmm.joysontech.com
            - name: RMM_SMTP_ADDR
              value: email-smtp.eu-west-2.amazonaws.com:587
            - name: RMM_SMTP_FROM
              value: alerts@joysontech.com
            - name: RMM_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: rmm-ses-smtp
                  key: RMM_SMTP_USER
            - name: RMM_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rmm-ses-smtp
                  key: RMM_SMTP_PASSWORD
            # The AWS identity the server signs in as to assume read-only roles in connected AWS accounts (Data sources).
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rmm-aws-platform
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rmm-aws-platform
                  key: AWS_SECRET_ACCESS_KEY
            - name: RMM_AWS_TEMPLATE_URL
              value: https://rmm-role-template-061051257340.s3.eu-west-2.amazonaws.com/fleet-console-access-role.yaml
            - name: RMM_TRUSTED_PROXIES
              value: 10.244.0.0/16
            - name: RMM_ENABLE_SHELL
              value: "true"
            - name: RMM_GUACD_ADDR
              value: "127.0.0.1:4822"
            # The IaC runner is its own Deployment, so an RMM deploy does not stop a running playbook.
            - name: RMM_IAC_RUNNER_URL
              value: "http://rmm-iac-runner.rmm.svc.cluster.local:8099"
            # Cloud tab template checks go to their own checks-only pod. Setting this switches Cloud on for servers at or
            # after the Cloud merge; older images ignore it.
            - name: RMM_TEMPLATE_CHECK_URL
              value: "http://rmm-cloud-checks.rmm.svc.cluster.local:8099"
            - name: RMM_STUB_TENANT_NAME
              value: Joysontech
            - name: RMM_STUB_EMAIL
              value: admin@joysontech.com
            - name: RMM_STUB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rmm-stub-auth
                  key: RMM_STUB_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Ready = database reachable and messaging connected.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          # Alive = the process answers. Not /healthz: a database or NATS outage
          # must take copies out of the load balancer, not restart all of them.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            # Let Traefik and the Service drop this copy before shutdown starts.
            preStop:
              sleep:
                seconds: 10
          volumeMounts:
            - name: ca
              mountPath: /etc/rmm/ca
              readOnly: true
            - name: secrets-key
              mountPath: /etc/rmm/secrets
              readOnly: true
            - name: nats-keys
              mountPath: /etc/rmm/nats
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # guacd (Apache Guacamole, Apache-2.0) speaks RDP for the Remote tab. It
        # listens on loopback only, so nothing but the server container can use it.
        - name: guacd
          image: guacamole/guacd:1.6.0
          command: ["/opt/guacamole/sbin/guacd"]
          args: ["-b", "127.0.0.1", "-L", "info", "-f"]
          env:
            # FreeRDP stores certificates under HOME; the root filesystem is read-only.
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          volumeMounts:
            - name: guacd-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        # The RMM CA (same Secret the cert-manager Issuer uses), as ca.crt/ca.key.
        - name: ca
          secret:
            secretName: rmm-ca
            defaultMode: 0440
            items:
              - key: tls.crt
                path: ca.crt
              - key: tls.key
                path: ca.key
        - name: secrets-key
          secret:
            secretName: rmm-secrets-key
            defaultMode: 0440
        - name: nats-keys
          secret:
            secretName: rmm-nats-keys
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
        - name: guacd-tmp
          emptyDir: {}

---
# One copy at a time may be evicted (node drains, cluster upgrades). Works with
# the single cut-over copy and with 3 copies.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rmm-server
  namespace: rmm
  labels:
    app: rmm
    team: platform
    env: production
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: rmm
      component: server

---
apiVersion: v1
kind: Service
metadata:
  name: rmm-http
  namespace: rmm
  labels:
    app: rmm
    team: platform
    env: production
spec:
  type: ClusterIP
  selector:
    app: rmm
    component: server
  ports:
    - name: http
      port: 80
      targetPort: http

---
# rmm-iac-runner clones a saved playbook's git repo and runs ansible-playbook
# against it. Its own Deployment, so restarting or rolling RMM copies does not
# touch a running playbook; copies follow its output over HTTP. One replica:
# runs live in its memory. Only RMM copies may reach it (NetworkPolicy
# rmm-iac-runner). CI bumps this image on every release, so the runner itself is
# replaced on deploys.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmm-iac-runner
  namespace: rmm
  labels:
    app: rmm-iac-runner
    team: platform
    env: production
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rmm-iac-runner
  template:
    metadata:
      labels:
        app: rmm-iac-runner
        team: platform
        env: production
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      automountServiceAccountToken: false
      # Time for running playbooks to finish when the runner is replaced. Only
      # effective with an RMM image at or after the always-on merge, whose runner
      # stops taking new runs on SIGTERM and finishes the running ones; older
      # runners exit at once.
      terminationGracePeriodSeconds: 900
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        # ansible-core, git and openssh-client need a writable root filesystem
        # for their own scratch files, unlike every other container here.
        - name: rmm-iac-runner
          image: ghcr.io/joyson-fernandes/rmm-iac-runner:c39de45
          env:
            - name: RMM_IAC_RUNNER_ADDR
              value: "0.0.0.0:8099"
          ports:
            - containerPort: 8099
              name: runner
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: runner
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: runner
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: rmm-iac-runner
  namespace: rmm
  labels:
    app: rmm-iac-runner
    team: platform
    env: production
spec:
  type: ClusterIP
  selector:
    app: rmm-iac-runner
  ports:
    - name: runner
      port: 8099
      targetPort: runner

---
# rmm-cloud-checks lints and rule-checks the CloudFormation templates the Cloud tab deploys (cfn-lint, cfn-guard). The
# same image as rmm-iac-runner, started in checks-only mode: it serves POST /check and refuses playbook runs. It is
# its own pod so a template never shares a process space with playbook runs and their SSH keys, and it has no service
# account token and no egress (NetworkPolicy rmm-cloud-checks). CI bumps the image together with rmm-iac-runner.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmm-cloud-checks
  namespace: rmm
  labels:
    app: rmm-cloud-checks
    team: platform
    env: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rmm-cloud-checks
  template:
    metadata:
      labels:
        app: rmm-cloud-checks
        team: platform
        env: production
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rmm-cloud-checks
          image: ghcr.io/joyson-fernandes/rmm-iac-runner:c39de45
          env:
            - name: RMM_RUNNER_MODE
              value: "checks"
            - name: RMM_IAC_RUNNER_ADDR
              value: "0.0.0.0:8099"
          ports:
            - containerPort: 8099
              name: checks
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: checks
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: checks
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: rmm-cloud-checks
  namespace: rmm
  labels:
    app: rmm-cloud-checks
    team: platform
    env: production
spec:
  type: ClusterIP
  selector:
    app: rmm-cloud-checks
  ports:
    - name: checks
      port: 8099
      targetPort: checks

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rmm-joysontech-com
  namespace: rmm
spec:
  secretName: rmm-joysontech-com-tls
  issuerRef:
    name: letsencrypt-dns01-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - rmm.joysontech.com

---
# Internal-only, same pattern as the other apps: DNS-01 certificate (no public
# exposure needed), IP allowlist as a backstop, access control is the user's
# split-horizon DNS.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-only
  namespace: rmm
spec:
  ipAllowList:
    sourceRange:
      - 10.0.0.0/8

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rmm
  namespace: rmm
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`rmm.joysontech.com`)
      middlewares:
        - name: internal-only
      services:
        - name: rmm-http
          port: 80
  tls:
    secretName: rmm-joysontech-com-tls

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: rmm
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rmm-redirect
  namespace: rmm
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`rmm.joysontech.com`)
      middlewares:
        - name: redirect-https
      services:
        - name: rmm-http
          port: 80

---
# Agents connect with mutual TLS to the NATS cluster (apps/nats-rmm.yaml), so
# Traefik passes the TLS connection through untouched, selected by SNI on the
# normal 443 port. Same public address as before: agents need no change.
apiVersion: traefik.io/v1alpha1
kind: MiddlewareTCP
metadata:
  name: internal-only-tcp
  namespace: rmm
spec:
  ipAllowList:
    sourceRange:
      - 10.0.0.0/8

---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: rmm-agents
  namespace: rmm
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`rmm-agents.joysontech.com`)
      middlewares:
        - name: internal-only-tcp
      services:
        - name: rmm-nats
          port: 4443
  tls:
    passthrough: true

---
# Nightly encrypted backup of the certificate authority, the stored-secrets key
# and the database to off-cluster object storage (30-day retention). In cluster
# mode the keys come from their Secrets, not from /data. The archive layout
# (state.tar with ca/ and secrets.key, plus rmm.dump) is unchanged, so the
# restore procedure is too. Offsite database backups come later (R2 bucket).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rmm-backup
  namespace: rmm
  labels:
    app: rmm-backup
    team: platform
    env: production
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: rmm-backup
            team: platform
            env: production
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: bundle
              image: ghcr.io/cloudnative-pg/postgresql:16.4
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  cd /work
                  mkdir -p state/ca
                  cp /keys/ca/ca.crt /keys/ca/ca.key state/ca/
                  cp /keys/secrets/secrets.key state/secrets.key
                  tar -C state -cf state.tar ca secrets.key
                  rm -rf state
                  PGPASSWORD="$DB_PASSWORD" pg_dump -h "$DB_HOST" -U "$DB_USER" -Fc "$DB_NAME" > rmm.dump
                  tar -cf - state.tar rmm.dump | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:BACKUP_PASSPHRASE -out "rmm-backup-$(date -u +%Y%m%d-%H%M%S).tar.enc"
                  rm -f state.tar rmm.dump
                  ls -l
              env:
                # Direct to the primary (rmm-db-rw): pg_dump needs one session.
                - {name: DB_HOST, valueFrom: {secretKeyRef: {name: rmm-db-app, key: host}}}
                - {name: DB_USER, valueFrom: {secretKeyRef: {name: rmm-db-app, key: username}}}
                - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: rmm-db-app, key: password}}}
                - {name: DB_NAME, valueFrom: {secretKeyRef: {name: rmm-db-app, key: dbname}}}
                - {name: BACKUP_PASSPHRASE, valueFrom: {secretKeyRef: {name: rmm-backup, key: BACKUP_PASSPHRASE}}}
              volumeMounts:
                - {name: ca, mountPath: /keys/ca, readOnly: true}
                - {name: secrets-key, mountPath: /keys/secrets, readOnly: true}
                - {name: work, mountPath: /work}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
          containers:
            - name: upload
              image: curlimages/curl:8.11.1
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  S3="http://10.0.1.54:9000/rmm-backups"
                  sig="aws:amz:us-east-1:s3"
                  for f in /work/rmm-backup-*.tar.enc; do
                    curl -sSf --aws-sigv4 "$sig" -u "$MINIO_USER:$MINIO_PASSWORD" -T "$f" "$S3/$(basename "$f")"
                    echo "uploaded $(basename "$f")"
                  done
                  cutoff=$(date -u -d "@$(( $(date +%s) - 2592000 ))" +%Y%m%d)
                  curl -sSf --aws-sigv4 "$sig" -u "$MINIO_USER:$MINIO_PASSWORD" "$S3/" | grep -o 'rmm-backup-[0-9]*-[0-9]*\.tar\.enc' | sort -u | while read -r k; do
                    d=${k#rmm-backup-}; d=${d%%-*}
                    if [ "$d" -lt "$cutoff" ]; then curl -sSf --aws-sigv4 "$sig" -u "$MINIO_USER:$MINIO_PASSWORD" -X DELETE "$S3/$k" && echo "expired $k"; fi
                  done
              env:
                - {name: MINIO_USER, valueFrom: {secretKeyRef: {name: rmm-backup, key: MINIO_USER}}}
                - {name: MINIO_PASSWORD, valueFrom: {secretKeyRef: {name: rmm-backup, key: MINIO_PASSWORD}}}
              volumeMounts:
                - {name: work, mountPath: /work}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
          volumes:
            - name: ca
              secret:
                secretName: rmm-ca
                defaultMode: 0440
                items:
                  - {key: tls.crt, path: ca.crt}
                  - {key: tls.key, path: ca.key}
            - name: secrets-key
              secret:
                secretName: rmm-secrets-key
                defaultMode: 0440
            - {name: work, emptyDir: {}}

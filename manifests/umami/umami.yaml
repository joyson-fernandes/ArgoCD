apiVersion: v1
kind: Namespace
metadata:
  name: umami
  labels:
    app: umami

---
# Umami's database used to be a dedicated single-instance Postgres
# StatefulSet run just for this app (this cluster had no shared
# Postgres/CNPG instance at the time). Migrated on 2026-09-11 into the
# shared CNPG cluster (shared-postgres namespace, see ~/ArgoCD
# manifests/shared-postgres/) — pg_dump/restore, verified row counts
# (website: 1, user: 1) match. umami-app now points there instead.
#
# umami-app secret is decrypted in-cluster by the Sealed Secrets
# controller (kube-system) from umami-app-sealedsecret.yaml in this
# directory. To rotate/recreate:
#   kubectl -n umami create secret generic umami-app \
#     --from-literal=DATABASE_URL='postgresql://umami:<password>@shared-postgres-rw.shared-postgres.svc.cluster.local:5432/umami' \
#     --from-literal=APP_SECRET='<random 32+ byte secret>' \
#     --dry-run=client -o json | kubeseal --format yaml > umami-app-sealedsecret.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  namespace: umami
  labels:
    app: umami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umami
  template:
    metadata:
      labels:
        app: umami
    spec:
      containers:
        - name: umami
          image: ghcr.io/umami-software/umami:postgresql-latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: umami-app
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: umami
  namespace: umami
  labels:
    app: umami
spec:
  type: ClusterIP
  selector:
    app: umami
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: analytics-joysontech-com
  namespace: umami
spec:
  secretName: analytics-joysontech-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - analytics.joysontech.com

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: umami
  namespace: umami
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`analytics.joysontech.com`)
      services:
        - name: umami
          port: 80
  tls:
    secretName: analytics-joysontech-com-tls

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: umami
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: umami-redirect
  namespace: umami
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`analytics.joysontech.com`)
      middlewares:
        - name: redirect-https
      services:
        - name: umami
          port: 80

apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: require-app-label
  namespace: test
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-app-label
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "The app label is required."
        pattern:
          metadata:
            labels:
              app: "?*"
# DNS-01 solver for internal-only hostnames that should never be
# publicly served (unlike letsencrypt-prod's HTTP-01 solver, which
# requires the route to be briefly reachable over the public internet).
# Proves domain ownership via a Cloudflare DNS TXT record instead.
#
# apiTokenSecretRef points at the Secret decrypted in-cluster from
# cloudflare-api-token-sealedsecret.yaml (SealedSecrets controller,
# kube-system) — encrypted with a token scoped to Zone:DNS:Edit on
# joysontech.com. Re-seal with:
#   kubectl -n cert-manager create secret generic cloudflare-api-token-secret \
#     --from-literal=api-token='<token>' --dry-run=client -o json | \
#     kubeseal --format yaml > cloudflare-api-token-sealedsecret.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01-cloudflare
spec:
  acme:
    email: jf@joysontech.com

    server: https://acme-v02.api.letsencrypt.org/directory

    privateKeySecretRef:
      name: letsencrypt-dns01-cloudflare

    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token

apiVersion: v1
kind: Namespace
metadata:
  name: ckad-exam-sim
  labels:
    app: ckad-exam-sim

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ckad-exam-sim
  namespace: ckad-exam-sim

---
# Deliberately broad, but not cluster-admin: this app dynamically creates
# a namespace per exam session with an unpredictable name, so per-namespace
# Roles can't be pre-scoped — it needs these resource kinds cluster-wide
# to install the vcluster Helm chart's objects, seed the exam state, and
# terminal-exec into the resulting bastion pod. It does NOT get any
# rights over Istio/networking CRDs on the host — that install only ever
# happens against a vcluster's own virtual API server.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ckad-exam-sim
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "pods/portforward", "services", "configmaps", "secrets", "serviceaccounts", "persistentvolumeclaims", "events"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ckad-exam-sim
subjects:
  - kind: ServiceAccount
    name: ckad-exam-sim
    namespace: ckad-exam-sim
roleRef:
  kind: ClusterRole
  name: ckad-exam-sim
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckad-exam-sim
  namespace: ckad-exam-sim
  labels:
    app: ckad-exam-sim
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ckad-exam-sim
  template:
    metadata:
      labels:
        app: ckad-exam-sim
    spec:
      serviceAccountName: ckad-exam-sim
      imagePullSecrets:
        - name: ckad-exam-sim-pull-secret
      containers:
        - name: server
          image: ghcr.io/joyson-fernandes/ckad-exam-sim:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: ckad-exam-sim-ghcr
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: ckad-exam-sim
  namespace: ckad-exam-sim
  labels:
    app: ckad-exam-sim
spec:
  type: ClusterIP
  selector:
    app: ckad-exam-sim
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ckad-exam-joysontech-com
  namespace: ckad-exam-sim
spec:
  secretName: ckad-exam-joysontech-com-tls
  issuerRef:
    name: letsencrypt-dns01-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - ckad-exam.joysontech.com

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-only
  namespace: ckad-exam-sim
spec:
  ipAllowList:
    sourceRange:
      - 10.0.0.0/8

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ckad-exam-sim
  namespace: ckad-exam-sim
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`ckad-exam.joysontech.com`)
      middlewares:
        - name: internal-only
      services:
        - name: ckad-exam-sim
          port: 80
  tls:
    secretName: ckad-exam-joysontech-com-tls

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: ckad-exam-sim
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ckad-exam-sim-redirect
  namespace: ckad-exam-sim
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`ckad-exam.joysontech.com`)
      middlewares:
        - name: internal-only
        - name: redirect-https
      services:
        - name: ckad-exam-sim
          port: 80

---
# Also reachable under the shared practiceexams.joysontech.com umbrella —
# same Service, same Middlewares, just a second subdomain/Certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ckad-practiceexams-joysontech-com
  namespace: ckad-exam-sim
spec:
  secretName: ckad-practiceexams-joysontech-com-tls
  issuerRef:
    name: letsencrypt-dns01-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - ckad.practiceexams.joysontech.com

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ckad-exam-sim-hub
  namespace: ckad-exam-sim
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`ckad.practiceexams.joysontech.com`)
      middlewares:
        - name: internal-only
      services:
        - name: ckad-exam-sim
          port: 80
  tls:
    secretName: ckad-practiceexams-joysontech-com-tls

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ckad-exam-sim-hub-redirect
  namespace: ckad-exam-sim
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`ckad.practiceexams.joysontech.com`)
      middlewares:
        - name: internal-only
        - name: redirect-https
      services:
        - name: ckad-exam-sim
          port: 80

apiVersion: v1
kind: Namespace
metadata:
  name: lfcs-exam-sim
  labels:
    app: lfcs-exam-sim

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lfcs-exam-sim
  namespace: lfcs-exam-sim

---
# Deliberately broad, but not cluster-admin: this app dynamically creates
# a namespace per exam session with an unpredictable name, so per-namespace
# Roles can't be pre-scoped — it needs these resource kinds cluster-wide to
# stand up the two privileged sandbox pods, stage exam files into them, and
# terminal-exec into the main one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lfcs-exam-sim
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "services", "secrets", "events"]
    verbs: ["*"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lfcs-exam-sim
subjects:
  - kind: ServiceAccount
    name: lfcs-exam-sim
    namespace: lfcs-exam-sim
roleRef:
  kind: ClusterRole
  name: lfcs-exam-sim
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lfcs-exam-sim
  namespace: lfcs-exam-sim
  labels:
    app: lfcs-exam-sim
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lfcs-exam-sim
  template:
    metadata:
      labels:
        app: lfcs-exam-sim
    spec:
      serviceAccountName: lfcs-exam-sim
      imagePullSecrets:
        - name: lfcs-exam-sim-pull-secret
      containers:
        - name: server
          image: ghcr.io/joyson-fernandes/lfcs-exam-sim:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: lfcs-exam-sim-ghcr
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: lfcs-exam-sim
  namespace: lfcs-exam-sim
  labels:
    app: lfcs-exam-sim
spec:
  type: ClusterIP
  selector:
    app: lfcs-exam-sim
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lfcs-exam-joysontech-com
  namespace: lfcs-exam-sim
spec:
  secretName: lfcs-exam-joysontech-com-tls
  issuerRef:
    name: letsencrypt-dns01-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - lfcs-exam.joysontech.com

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-only
  namespace: lfcs-exam-sim
spec:
  ipAllowList:
    sourceRange:
      - 10.0.0.0/8

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lfcs-exam-sim
  namespace: lfcs-exam-sim
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`lfcs-exam.joysontech.com`)
      middlewares:
        - name: internal-only
      services:
        - name: lfcs-exam-sim
          port: 80
  tls:
    secretName: lfcs-exam-joysontech-com-tls

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: lfcs-exam-sim
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lfcs-exam-sim-redirect
  namespace: lfcs-exam-sim
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`lfcs-exam.joysontech.com`)
      middlewares:
        - name: internal-only
        - name: redirect-https
      services:
        - name: lfcs-exam-sim
          port: 80

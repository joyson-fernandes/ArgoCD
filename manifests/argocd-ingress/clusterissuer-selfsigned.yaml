# Internal-only ArgoCD UI (argocd.joysontech.com) uses a self-signed cert
# rather than letsencrypt-prod, since Let's Encrypt HTTP-01 validation
# would require briefly exposing the route publicly. Split-horizon DNS
# (owner's own DNS server) keeps this host resolving internally only.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}

apiVersion: v1
kind: Namespace
metadata:
  name: homelab-guides
  labels:
    app: homelab-guides

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-guides
  namespace: homelab-guides
  labels:
    app: homelab-guides
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelab-guides
  template:
    metadata:
      labels:
        app: homelab-guides
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: homelab-guides
          image: ghcr.io/joyson-fernandes/homelab-guides:b2d4c66
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: homelab-guides
  namespace: homelab-guides
  labels:
    app: homelab-guides
spec:
  type: ClusterIP
  selector:
    app: homelab-guides
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: guides-joysontech-com
  namespace: homelab-guides
spec:
  secretName: guides-joysontech-com-tls
  issuerRef:
    name: letsencrypt-dns01-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - guides.joysontech.com

---
# Internal-only, same pattern as argocd-ingress/grafana-ingress: DNS-01
# cert (no public exposure needed to issue it), IP-allowlist as a
# backstop, real access control is the user's own split-horizon DNS.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-only
  namespace: homelab-guides
spec:
  ipAllowList:
    sourceRange:
      - 10.0.0.0/8

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homelab-guides
  namespace: homelab-guides
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`guides.joysontech.com`)
      middlewares:
        - name: internal-only
      services:
        - name: homelab-guides
          port: 80
  tls:
    secretName: guides-joysontech-com-tls

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: homelab-guides
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homelab-guides-redirect
  namespace: homelab-guides
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`guides.joysontech.com`)
      middlewares:
        - name: internal-only
        - name: redirect-https
      services:
        - name: homelab-guides
          port: 80

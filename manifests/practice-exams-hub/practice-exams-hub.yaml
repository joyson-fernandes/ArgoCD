apiVersion: v1
kind: Namespace
metadata:
  name: practice-exams-hub
  labels:
    app: practice-exams-hub

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-exams-hub
  namespace: practice-exams-hub
  labels:
    app: practice-exams-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: practice-exams-hub
  template:
    metadata:
      labels:
        app: practice-exams-hub
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: practice-exams-hub-html

---
apiVersion: v1
kind: Service
metadata:
  name: practice-exams-hub
  namespace: practice-exams-hub
  labels:
    app: practice-exams-hub
spec:
  type: ClusterIP
  selector:
    app: practice-exams-hub
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: practiceexams-joysontech-com
  namespace: practice-exams-hub
spec:
  secretName: practiceexams-joysontech-com-tls
  issuerRef:
    name: letsencrypt-dns01-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - practiceexams.joysontech.com

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-only
  namespace: practice-exams-hub
spec:
  ipAllowList:
    sourceRange:
      - 10.0.0.0/8

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: practice-exams-hub
  namespace: practice-exams-hub
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`practiceexams.joysontech.com`)
      middlewares:
        - name: internal-only
      services:
        - name: practice-exams-hub
          port: 80
  tls:
    secretName: practiceexams-joysontech-com-tls

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: practice-exams-hub
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: practice-exams-hub-redirect
  namespace: practice-exams-hub
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`practiceexams.joysontech.com`)
      middlewares:
        - name: internal-only
        - name: redirect-https
      services:
        - name: practice-exams-hub
          port: 80

                <div class="stat"><b>75%</b><span>To Pass</span></div>
              </div>
              <div class="card-cta">Start Quiz <span class="arrow">→</span></div>
            </a>
            <a class="card" href="https://ica.practiceexams.joysontech.com">
              <img class="card-badge-big" src="https://images.credly.com/images/d7d4ddc8-7df8-4c03-9343-507b51e0ef99/image.png" alt="ICA badge" />
              <div class="card-acronym">ICA</div>
              <div class="card-name">Istio Certified Associate</div>
              <p class="card-desc">Service mesh tasks covering Gateways, VirtualServices, mTLS, and traffic policy.</p>
              <div class="card-stats">
                <div class="stat"><b>22</b><span>Tasks</span></div>
                <div class="stat"><b>~2 min</b><span>Setup</span></div>
                <div class="stat"><b>Real</b><span>vCluster</span></div>
              </div>
              <div class="card-cta">Start Simulator <span class="arrow">→</span></div>
            </a>
            <a class="card" href="https://quiz.practiceexams.joysontech.com/cgoa">
              <img class="card-badge-big" src="https://images.credly.com/images/7219d055-4e97-439c-b244-8fbe885fa06b/image.png" alt="CGOA badge" />
              <div class="card-acronym">CGOA</div>
              <div class="card-name">Certified GitOps Associate</div>
              <p class="card-desc">GitOps principles, Argo CD &amp; Flux, declarative deployment workflows.</p>
              <div class="card-stats">
                <div class="stat"><b>60</b><span>Questions</span></div>
                <div class="stat"><b>90 min</b><span>Exam Mode</span></div>
                <div class="stat"><b>75%</b><span>To Pass</span></div>
              </div>
              <div class="card-cta">Start Quiz <span class="arrow">→</span></div>
            </a>
            <a class="card" href="https://quiz.practiceexams.joysontech.com/kca">
              <img class="card-badge-big" src="https://images.credly.com/images/2592935a-d8fa-405d-b40a-711a75454fc2/image.png" alt="KCA badge" />
              <div class="card-acronym">KCA</div>
              <div class="card-name">Kyverno Certified Associate</div>
              <p class="card-desc">Kubernetes policy-as-code with Kyverno: validate, mutate, generate, and verifyImages policies.</p>
              <div class="card-stats">
                <div class="stat"><b>60</b><span>Questions</span></div>
                <div class="stat"><b>90 min</b><span>Exam Mode</span></div>
                <div class="stat"><b>75%</b><span>To Pass</span></div>
              </div>
              <div class="card-cta">Start Quiz <span class="arrow">→</span></div>
            </a>
            <div class="card soon">
              <div class="card-badge-big placeholder">CBA</div>
              <div class="card-acronym">CBA</div>
              <div class="card-name">Certified Backstage Associate</div>
              <p class="card-desc">Backstage plugins, software catalog, internal developer portals.</p>
              <div class="card-stats">
                <div class="stat"><b>—</b><span>Questions</span></div>

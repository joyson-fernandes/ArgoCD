                <div class="stat"><b>—</b><span>To Pass</span></div>
              </div>
              <span class="tag soon">coming soon</span>
            </div>
            <a class="card" href="https://lfcs.practiceexams.joysontech.com">
              <img class="card-badge-big" src="https://images.credly.com/images/1677b995-9642-44e2-8961-026f84810bbc/blob" alt="LFCS badge" />
              <div class="card-acronym">LFCS</div>
              <div class="card-name">Linux Foundation Certified System Administrator</div>
              <p class="card-desc">Real Linux sysadmin work with LVM, systemd, networking, and Docker.</p>
              <div class="card-stats">
                <div class="stat"><b>17</b><span>Tasks</span></div>

            <div class="card soon">
              <div class="card-badge-big placeholder">CNPA</div>
              <div class="card-acronym">CNPA</div>
              <div class="card-name">Cloud Native Platform Engineering Associate</div>
              <p class="card-desc">Platform engineering principles and internal developer platforms.</p>
              <div class="card-stats">
                <div class="stat"><b>—</b><span>Questions</span></div>
                <div class="stat"><b>—</b><span>Duration</span></div>
                <div class="stat"><b>—</b><span>To Pass</span></div>
              </div>
              <span class="tag soon">coming soon</span>
            </div>
            <div class="card soon">
              <div class="card-badge-big placeholder">CNPE</div>
              <div class="card-acronym">CNPE</div>
              <div class="card-name">Cloud Native Platform Engineering Expert</div>
              <p class="card-desc">Advanced platform engineering across the CNCF landscape.</p>
              <div class="card-stats">
                <div class="stat"><b>—</b><span>Questions</span></div>
                <div class="stat"><b>—</b><span>Duration</span></div>
                <div class="stat"><b>—</b><span>To Pass</span></div>
              </div>
              <span class="tag soon">coming soon</span>
            </div>
            <div class="card soon">
              <div class="card-badge-big placeholder">CCA</div>
              <div class="card-acronym">CCA</div>
              <div class="card-name">Cilium Certified Associate</div>
              <p class="card-desc">eBPF-based networking, security, and observability with Cilium.</p>
              <div class="card-stats">
                <div class="stat"><b>—</b><span>Questions</span></div>

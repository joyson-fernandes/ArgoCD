      </div>
      <script>
        try {
          var saved = localStorage.getItem('pe-theme');
          if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
        document.getElementById('theme-toggle').addEventListener('click', function() {
          var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', next);
          try { localStorage.setItem('pe-theme', next); } catch (e) {}
        });

        var checkboxes = document.querySelectorAll('input[data-filter]');
        var cards = document.querySelectorAll('#grid > [data-track]');
        function groups() {
          var g = {};
          checkboxes.forEach(function(cb) {
            g[cb.dataset.filter] = g[cb.dataset.filter] || [];
            if (cb.checked) g[cb.dataset.filter].push(cb.value);
          });
          return g;
        }
        function applyFilters() {
          var g = groups();
          var visible = 0;
          cards.forEach(function(card) {
            var match = ['track', 'type', 'status'].every(function(key) {
              return g[key].indexOf(card.dataset[key]) !== -1;
            });
            card.hidden = !match;
            if (match) visible++;
          });
          document.getElementById('result-count').textContent = visible;
        }
        checkboxes.forEach(function(cb) { cb.addEventListener('change', applyFilters); });
        document.getElementById('reset-filters').addEventListener('click', function() {
          checkboxes.forEach(function(cb) { cb.checked = true; });
          applyFilters();
        });
      </script>
    </body>

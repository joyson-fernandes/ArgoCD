      <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
      <style>
        :root, [data-theme="dark"] {
          --bg: #0d0f12;
          --bg-soft: #14161b;
          --panel: #16181d;
          --line: #272a31;
          --text: #eaebee;
          --text-dim: #9a9fa8;
          --text-faint: #5f6570;
          --blue: #4d9fff;
          --blue-dim: #14243a;
          --gold: #e0ab52;
          --gold-dim: #201a10;
          --gold-line: #423519;
          --gold-text: #d9b774;
          --shadow: 0 1px 2px rgba(0,0,0,0.4);
        }
        [data-theme="light"] {
          --bg: #ffffff;
          --bg-soft: #f6f7f8;
          --panel: #ffffff;
          --line: #e2e4e8;
          --text: #14161a;
          --text-dim: #5c626c;
          --text-faint: #8b929c;
          --blue: #1f6fd6;
          --gold: #a1701a;
          --gold-dim: #fbf3e2;
          --gold-line: #ecd9ab;
          --gold-text: #6b5a35;
          --shadow: 0 1px 2px rgba(20,22,26,0.06);
        }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          background: var(--bg);
          color: var(--text);
          font-family: 'Public Sans', system-ui, sans-serif;
          -webkit-font-smoothing: antialiased;
          min-height: 100vh;
          transition: background-color 0.15s ease, color 0.15s ease;
        }
        .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }

        header { border-bottom: 1px solid var(--line); }
        .header-inner {
          max-width: 1240px; margin: 0 auto; padding: 0 24px;
          display: flex; align-items: center; justify-content: space-between; height: 64px;
        }
        .brand { display: flex; align-items: center; gap: 11px; }
        .brand-mark { width: 28px; height: 28px; flex-shrink: 0; display: block; border-radius: 6px; }
        .brand span { font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 15.5px; color: var(--text); }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .theme-toggle {
          width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
          color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .theme-toggle:hover { color: var(--text); border-color: var(--blue); }
        .theme-toggle svg { width: 16px; height: 16px; }
        [data-theme="light"] .icon-moon, [data-theme="dark"] .icon-sun { display: none; }
        .logout-link {
          font-family: 'IBM Plex Sans', sans-serif; font-weight: 500;
          font-size: 13px; color: var(--text-dim); text-decoration: none;
          border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px;
          transition: border-color 0.15s, color 0.15s;
        }
        .logout-link:hover { color: var(--text); border-color: var(--blue); }

        .hero { padding: 40px 0 32px; }
        h1 {
          font-family: 'IBM Plex Sans', sans-serif; font-size: 32px; font-weight: 700;
          letter-spacing: -0.015em; margin: 0 0 10px; line-height: 1.15; text-wrap: balance;
        }
        .sub { color: var(--text-dim); font-size: 15.5px; line-height: 1.6; max-width: 60ch; margin: 0; }

        .disclaimer {
          display: flex; gap: 12px; align-items: flex-start;
          background: var(--gold-dim); border: 1px solid var(--gold-line); border-radius: 10px;
          padding: 14px 18px; margin: 24px 0 0;
        }
        .disclaimer svg { flex-shrink: 0; margin-top: 2px; color: var(--gold); }
        .disclaimer p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--gold-text); }
        .disclaimer p b { color: var(--text); font-weight: 700; }

        .layout { display: grid; grid-template-columns: 232px 1fr; gap: 32px; padding-bottom: 64px; align-items: start; }

        .filters { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 24px; }
        .filter-group h3 {
          font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500;
          letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint);
          margin: 0 0 12px;
        }
        .filter-row {
          display: flex; align-items: center; justify-content: space-between; gap: 8px;
          padding: 6px 0; font-size: 13.5px; color: var(--text-dim); cursor: pointer;
        }
        .filter-row:hover { color: var(--text); }
        .filter-row .check {
          display: flex; align-items: center; gap: 9px;
        }
        .filter-row input {
          width: 15px; height: 15px; border-radius: 4px; accent-color: var(--blue); cursor: pointer;
        }
        .filter-row .count {
          font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-faint);
        }
        .filter-reset {
          font-size: 12.5px; color: var(--blue); background: none; border: none; cursor: pointer;
          padding: 0; text-align: left; font-family: 'Public Sans', sans-serif; font-weight: 600;
        }

        .results-bar {
          display: flex; align-items: center; justify-content: space-between;
          margin-bottom: 18px; font-size: 13px; color: var(--text-dim);
        }
        .results-bar b { color: var(--text); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }

        a.card, div.card {
          background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          text-decoration: none; color: var(--text); padding: 22px 20px 18px;
          display: flex; flex-direction: column; align-items: center; text-align: center;
          box-shadow: var(--shadow);
          transition: border-color 0.15s ease, transform 0.15s ease;
        }
        a.card:hover { border-color: var(--blue); transform: translateY(-2px); }

        .card-badge-wrap {
          width: 92px; height: 92px; border-radius: 50%; background: var(--bg-soft);
          display: flex; align-items: center; justify-content: center; margin-bottom: 14px; flex-shrink: 0;
        }
        .card-badge-big { width: 66px; height: 66px; object-fit: contain; }
        .card-badge-big.placeholder {
          font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 500; color: var(--text-faint);
        }
        .card-acronym { font-family: 'IBM Plex Sans', sans-serif; font-size: 17px; font-weight: 700; }
        .card-name { font-size: 12px; color: var(--text-dim); margin: 4px 0 12px; line-height: 1.4; min-height: 32px; }
        .card-desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.55; margin: 0 0 16px; min-height: 36px; }

        .type-badge {
          font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500;
          letter-spacing: 0.04em; text-transform: uppercase; color: var(--blue);
          background: var(--bg-soft); border-radius: 100px; padding: 4px 11px; margin-bottom: 14px;
        }
        div.card.soon .type-badge { color: var(--text-faint); }

        .card-meta {
          display: flex; gap: 12px; font-family: 'IBM Plex Mono', monospace;
          font-size: 11px; color: var(--text-faint); margin-top: auto; padding-top: 12px;
          border-top: 1px solid var(--line); width: 100%; justify-content: center;
        }
        .card-meta b { color: var(--text); font-weight: 500; }

        .card-cta {
          color: var(--blue); font-weight: 600; font-size: 12.5px;
          display: flex; align-items: center; gap: 6px; margin-top: 12px;
        }
        .card-cta .arrow { transition: transform 0.15s ease; }
        a.card:hover .card-cta .arrow { transform: translateX(3px); }
        div.card.soon { opacity: 0.55; }
        .tag.soon {
          font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 500;
          color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em;
          margin-top: 12px;
        }

        footer {
          padding: 24px 0; border-top: 1px solid var(--line);
          text-align: center; color: var(--text-faint); font-size: 12px;
          font-family: 'IBM Plex Mono', monospace;
          display: flex; flex-direction: column; gap: 6px; align-items: center;
        }

        @media (max-width: 860px) {
          .layout { grid-template-columns: 1fr; }
          .filters { position: static; flex-direction: row; flex-wrap: wrap; gap: 28px; }
        }
      </style>
    </head>

apiVersion: v1
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Practice Exams</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
      <style>
        :root {
          color-scheme: dark;
          --bg: #08090d;
          --panel: #101319;
          --panel-2: #161a23;
          --border: #212633;
          --border-hover: #34405c;
          --text: #edeff3;
          --text-dim: #8991a3;
          --text-faint: #565f72;
          --accent: #5b8def;
          --accent-2: #8b5cf6;
        }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          background:
            radial-gradient(1100px 520px at 18% -8%, rgba(91,141,239,0.16), transparent 60%),
            radial-gradient(900px 480px at 88% 8%, rgba(139,92,246,0.12), transparent 55%),
            var(--bg);
          color: var(--text);
          font-family: 'Inter', system-ui, sans-serif;
          -webkit-font-smoothing: antialiased;
          min-height: 100vh;
        }
        .wrap {
          max-width: 1040px;
          margin: 0 auto;
          padding: 56px 20px 64px;
        }
        header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 72px;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-mark {
          width: 30px; height: 30px; border-radius: 9px;
          background: linear-gradient(135deg, var(--accent), var(--accent-2));
          display: flex; align-items: center; justify-content: center;
          font-size: 13px; font-weight: 800; color: white; flex-shrink: 0;
          letter-spacing: -0.02em;
        }
        .brand span { font-weight: 700; font-size: 14.5px; letter-spacing: -0.01em; }
        .pill {
          font-size: 12px; color: var(--text-dim);
          border: 1px solid var(--border); border-radius: 100px;
          padding: 6px 13px; display: flex; align-items: center; gap: 6px;
        }
        .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 3px rgba(52,211,153,0.15); }

        .hero { text-align: center; margin-bottom: 56px; }
        .kicker {
          display: inline-block; font-size: 12.5px; font-weight: 600;
          color: var(--accent); letter-spacing: 0.02em; margin-bottom: 18px;
          background: rgba(91,141,239,0.1); border: 1px solid rgba(91,141,239,0.25);
          padding: 5px 14px; border-radius: 100px;
        }
        h1 {
          font-size: 44px; font-weight: 800; letter-spacing: -0.03em;
          margin: 0 0 18px; line-height: 1.08;
        }
        h1 em { font-style: normal; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .sub {
          color: var(--text-dim); font-size: 16.5px; line-height: 1.6;
          max-width: 560px; margin: 0 auto;
        }

        section.track { margin-bottom: 52px; }
        .track-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 18px; }
        .track-head h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
        .track-head p { font-size: 13px; color: var(--text-dim); margin: 0; }

        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
          gap: 14px;
        }
        a.card, div.card {
          position: relative;
          background: var(--panel);
          border: 1px solid var(--border);
          border-radius: 16px;
          padding: 22px;
          text-decoration: none;
          color: var(--text);
          transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
          display: flex;
          flex-direction: column;
          gap: 14px;
          overflow: hidden;
        }
        a.card::before {
          content: '';
          position: absolute; inset: 0;
          background: linear-gradient(135deg, rgba(91,141,239,0.08), rgba(139,92,246,0.05));
          opacity: 0; transition: opacity 0.2s ease;
        }
        a.card:hover {
          border-color: var(--border-hover);
          transform: translateY(-3px);
          background: var(--panel-2);
        }
        a.card:hover::before { opacity: 1; }
        div.card.soon { opacity: 0.5; }
        .card-top { display: flex; align-items: center; justify-content: space-between; position: relative; }
        .card-badge {
          width: 80px; height: 80px; border-radius: 14px;
          object-fit: contain; background: var(--panel-2);
          border: 1px solid var(--border); padding: 8px;
          flex-shrink: 0;
        }
        .card-badge.placeholder {
          display: flex; align-items: center; justify-content: center;
          font-size: 13px; font-weight: 800; color: var(--text-faint);
          font-family: 'JetBrains Mono', monospace;
        }
        .card-arrow {
          color: var(--text-faint); font-size: 17px; transition: transform 0.2s ease, color 0.2s ease;
        }
        a.card:hover .card-arrow { transform: translate(3px, -3px); color: var(--accent); }
        .card h3 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: -0.01em; position: relative; }
        .card p { font-size: 13px; color: var(--text-dim); margin: 0; line-height: 1.5; position: relative; }
        .card-tags { display: flex; gap: 6px; flex-wrap: wrap; position: relative; }
        .tag {
          font-size: 10.5px; font-family: 'JetBrains Mono', monospace; color: var(--text-dim);
          background: rgba(255,255,255,0.04); border: 1px solid var(--border);
          padding: 3px 7px; border-radius: 6px;
        }
        .tag.soon { color: #f5b34d; background: rgba(245,179,77,0.08); border-color: rgba(245,179,77,0.25); }

        footer {
          margin-top: 56px; text-align: center;
          color: var(--text-faint); font-size: 12.5px;
          display: flex; flex-direction: column; gap: 6px; align-items: center;
        }

        @media (max-width: 560px) {
          h1 { font-size: 32px; }
          header { margin-bottom: 48px; }
          .hero { margin-bottom: 40px; }
        }
      </style>
    </head>
    <body>
      <div class="wrap">
        <header>
          <div class="brand">
            <div class="brand-mark">PE</div>
            <span>Practice Exams</span>
          </div>
          <div class="pill"><span class="dot"></span>9 exams live</div>
        </header>

        <div class="hero">
          <span class="kicker">Hands-on and multiple choice</span>
          <h1>Practice like it's <em>the real exam</em></h1>
          <p class="sub">Real terminals, real clusters, root access — spun up fresh and torn down when you're done. Two paths: the Kubestronaut core certs, and everything beyond it toward Golden Kubestronaut.</p>
        </div>

        <section class="track">
          <div class="track-head">
            <h2>Kubestronaut</h2>
            <p>The five certifications required for the title.</p>
          </div>
          <div class="grid">
            <a class="card" href="https://quiz.practiceexams.joysontech.com/kcna">
              <div class="card-top">
                <img class="card-badge" src="https://images.credly.com/images/f28f1d88-428a-47f6-95b5-7da1dd6c1000/KCNA_badge.png" alt="KCNA badge" />
                <span class="card-arrow">&#8599;</span>
              </div>
              <h3>Kubernetes and Cloud Native Associate</h3>
              <p>Multiple choice — core Kubernetes concepts and the cloud-native landscape.</p>
              <div class="card-tags"><span class="tag">mcq</span><span class="tag">39 questions</span></div>
            </a>
            <a class="card" href="https://quiz.practiceexams.joysontech.com/kcsa">
              <div class="card-top">
                <img class="card-badge" src="https://images.credly.com/images/67dd8a95-8876-4051-9cb9-3d97c204f85a/image.png" alt="KCSA badge" />
                <span class="card-arrow">&#8599;</span>
              </div>
              <h3>Kubernetes and Cloud Native Security Associate</h3>
              <p>Multiple choice — security fundamentals across the cluster and supply chain.</p>
              <div class="card-tags"><span class="tag">mcq</span><span class="tag">94 questions</span></div>
            </a>
            <a class="card" href="https://cka.practiceexams.joysontech.com">
              <div class="card-top">
                <img class="card-badge" src="https://images.credly.com/images/8b8ed108-e77d-4396-ac59-2504583b9d54/cka_from_cncfsite__281_29.png" alt="CKA badge" />
                <span class="card-arrow">&#8599;</span>
              </div>
              <h3>Certified Kubernetes Administrator</h3>
              <p>Cluster administration against a real Kubernetes API — RBAC, storage, networking, workloads.</p>
              <div class="card-tags"><span class="tag">kubectl</span><span class="tag">rbac</span><span class="tag">25 tasks</span></div>
            </a>
            <a class="card" href="https://ckad.practiceexams.joysontech.com">
              <div class="card-top">
                <img class="card-badge" src="https://images.credly.com/images/cc8adc83-1dc6-4d57-8e20-22171247e052/blob" alt="CKAD badge" />
                <span class="card-arrow">&#8599;</span>
              </div>
              <h3>Certified Kubernetes Application Developer</h3>
              <p>Build and deploy workloads against a real Kubernetes API — Deployments, Jobs, probes, ingress, Helm.</p>
              <div class="card-tags"><span class="tag">kubectl</span><span class="tag">helm</span><span class="tag">18 tasks</span></div>
            </a>
            <div class="card soon">
              <div class="card-top">
                <img class="card-badge" src="https://images.credly.com/images/9945dfcb-1cca-4529-85e6-db1be3782210/kubernetes-security-specialist-logo2.png" alt="CKS badge" />
              </div>
              <h3>Certified Kubernetes Security Specialist</h3>
              <p>Runtime sandboxing, AppArmor/seccomp, CIS benchmarking, admission control, on a real cluster.</p>
              <div class="card-tags"><span class="tag soon">coming soon</span></div>
            </div>
          </div>
        </section>

        <section class="track">
          <div class="track-head">
            <h2>Golden Kubestronaut</h2>
            <p>Every additional cert on the way to Golden status.</p>
          </div>
          <div class="grid">
            <a class="card" href="https://quiz.practiceexams.joysontech.com/pca">
              <div class="card-top">
                <img class="card-badge" src="https://images.credly.com/images/c34436dc-1cfd-4125-a862-35f9c86ca17f/image.png" alt="PCA badge" />
                <span class="card-arrow">&#8599;</span>
              </div>
              <h3>Prometheus Certified Associate</h3>
              <p>Multiple choice — observability, PromQL, exporters, alerting.</p>
              <div class="card-tags"><span class="tag">mcq</span><span class="tag">60 questions</span></div>
            </a>
            <a class="card" href="https://quiz.practiceexams.joysontech.com/capa">
              <div class="card-top">
                <img class="card-badge" src="https://images.credly.com/images/12624f9e-6b4a-43f0-b7a2-afb2c6cf8059/image.png" alt="CAPA badge" />
                <span class="card-arrow">&#8599;</span>
              </div>
              <h3>Certified Argo Project Associate</h3>
              <p>Multiple choice — Argo Workflows, Argo CD, Rollouts, and Events.</p>
              <div class="card-tags"><span class="tag">mcq</span><span class="tag">25 questions</span></div>
            </a>
            <a class="card" href="https://ica.practiceexams.joysontech.com">
              <div class="card-top">
                <img class="card-badge" src="https://images.credly.com/images/d7d4ddc8-7df8-4c03-9343-507b51e0ef99/image.png" alt="ICA badge" />
                <span class="card-arrow">&#8599;</span>
              </div>
              <h3>Istio Certified Associate</h3>
              <p>Service mesh tasks in an isolated vcluster — Gateways, VirtualServices, mTLS, traffic policy.</p>
              <div class="card-tags"><span class="tag">vcluster</span><span class="tag">istio</span><span class="tag">22 tasks</span></div>
            </a>
            <a class="card" href="https://quiz.practiceexams.joysontech.com/cgoa">
              <div class="card-top">
                <img class="card-badge" src="https://images.credly.com/images/7219d055-4e97-439c-b244-8fbe885fa06b/image.png" alt="CGOA badge" />
                <span class="card-arrow">&#8599;</span>
              </div>
              <h3>Certified GitOps Associate</h3>
              <p>Multiple choice — GitOps principles, Argo CD &amp; Flux, declarative delivery.</p>
              <div class="card-tags"><span class="tag">mcq</span><span class="tag">25 questions</span></div>
            </a>
            <div class="card soon">
              <div class="card-top"><img class="card-badge" src="https://images.credly.com/images/2592935a-d8fa-405d-b40a-711a75454fc2/image.png" alt="KCA badge" /></div>
              <h3>Kyverno Certified Associate</h3>
              <p>Kubernetes policy-as-code with Kyverno.</p>
              <div class="card-tags"><span class="tag soon">coming soon</span></div>
            </div>
            <div class="card soon">
              <div class="card-top"><div class="card-badge placeholder">CBA</div></div>
              <h3>Certified Backstage Associate</h3>
              <p>Backstage plugins, software catalog, internal developer portals.</p>
              <div class="card-tags"><span class="tag soon">coming soon</span></div>
            </div>
            <div class="card soon">
              <div class="card-top"><div class="card-badge placeholder">CNPA</div></div>
              <h3>Cloud Native Platform Engineering Associate</h3>
              <p>Platform engineering principles and internal developer platforms.</p>
              <div class="card-tags"><span class="tag soon">coming soon</span></div>
            </div>
            <div class="card soon">
              <div class="card-top"><div class="card-badge placeholder">CNPE</div></div>
              <h3>Cloud Native Platform Engineering Expert</h3>
              <p>Advanced platform engineering across the CNCF landscape.</p>
              <div class="card-tags"><span class="tag soon">coming soon</span></div>
            </div>
            <div class="card soon">
              <div class="card-top"><div class="card-badge placeholder">CCA</div></div>
              <h3>Cilium Certified Associate</h3>
              <p>eBPF-based networking, security, and observability with Cilium.</p>
              <div class="card-tags"><span class="tag soon">coming soon</span></div>
            </div>
            <a class="card" href="https://lfcs.practiceexams.joysontech.com">
              <div class="card-top">
                <img class="card-badge" src="https://images.credly.com/images/1677b995-9642-44e2-8961-026f84810bbc/blob" alt="LFCS badge" />
                <span class="card-arrow">&#8599;</span>
              </div>
              <h3>Linux Foundation Certified System Administrator</h3>
              <p>Real Linux sysadmin work on a privileged sandbox box — LVM, systemd, networking, Docker.</p>
              <div class="card-tags"><span class="tag">systemd</span><span class="tag">docker</span><span class="tag">17 tasks</span></div>
            </a>
            <div class="card soon">
              <div class="card-top"><div class="card-badge placeholder">OTCA</div></div>
              <h3>OpenTelemetry Certified Associate</h3>
              <p>Traces, metrics, logs, and the OpenTelemetry Collector pipeline.</p>
              <div class="card-tags"><span class="tag soon">coming soon</span></div>
            </div>
          </div>
        </section>

        <footer>
          <span>Each exam runs as its own independently scaled environment.</span>
          <span>Built by Joyson Fernandes</span>
        </footer>
      </div>
    </body>
    </html>
kind: ConfigMap
metadata:
  name: practice-exams-hub-html
  namespace: practice-exams-hub

# Defense in depth: grafana.joysontech.com is meant to resolve only via
# internal split-horizon DNS. This middleware also rejects any request
# not originating from the home network's private address space, same
# rationale as argocd-ingress's internal-only middleware.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-only
  namespace: monitoring
spec:
  ipAllowList:
    sourceRange:
      - 10.0.0.0/8

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure

  routes:
    - kind: Rule
      match: Host(`grafana.joysontech.com`)
      middlewares:
        - name: internal-only
      services:
        - name: kube-prometheus-stack-grafana
          port: 3000

  tls:
    secretName: grafana-joysontech-com-tls

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: monitoring
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-redirect
  namespace: monitoring
spec:
  entryPoints:
    - web

  routes:
    - kind: Rule
      match: Host(`grafana.joysontech.com`)
      middlewares:
        - name: internal-only
        - name: redirect-https
      services:
        - name: kube-prometheus-stack-grafana
          port: 3000

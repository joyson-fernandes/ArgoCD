apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runner-portfolio
  namespace: arc-runners
---
# Lets the portfolio runner pod manage its own per-PR preview namespaces
# (portfolio-preview-<PR#>) and the workloads inside them. Scoped to what
# the preview job needs — not a general cluster-admin grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arc-runner-portfolio-preview
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arc-runner-portfolio-preview
subjects:
  - kind: ServiceAccount
    name: arc-runner-portfolio
    namespace: arc-runners
roleRef:
  kind: ClusterRole
  name: arc-runner-portfolio-preview
  apiGroup: rbac.authorization.k8s.io

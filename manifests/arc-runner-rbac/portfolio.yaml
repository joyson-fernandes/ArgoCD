apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runner-portfolio
  namespace: arc-runners
---
# Lets the portfolio runner pod use `docker buildx create --driver kubernetes`,
# which spins up a rootless BuildKit builder pod in this namespace and drives
# it via exec/log/portforward instead of a local Docker daemon.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arc-runner-portfolio-buildx
  namespace: arc-runners
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/exec", "pods/portforward"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arc-runner-portfolio-buildx
  namespace: arc-runners
subjects:
  - kind: ServiceAccount
    name: arc-runner-portfolio
    namespace: arc-runners
roleRef:
  kind: Role
  name: arc-runner-portfolio-buildx
  apiGroup: rbac.authorization.k8s.io

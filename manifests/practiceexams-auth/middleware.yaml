# Shared auth gate for every practiceexams.joysontech.com app. Chained as
# [practiceexams-auth-errors, practiceexams-auth] on each protected
# IngressRoute -- errors must come first in the list since Traefik
# middlewares wrap outward-in, and it can only catch a status code from
# whatever runs after it. The forwardAuth checks the session cookie
# against oauth2-proxy-google's /auth endpoint (any instance can
# validate a session cookie regardless of which provider created it,
# since both share the same cookie secret and cookie domain); on a 401
# the errors middleware swaps in the picker page's content, in place,
# without changing the browser's address bar -- the picker's own script
# reads window.location.href (which is still the original URL the
# visitor tried to reach) to build each provider's ?rd= redirect target.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: practiceexams-auth
  namespace: practiceexams-auth
spec:
  forwardAuth:
    address: "http://oauth2-proxy-google.practiceexams-auth.svc.cluster.local:4180/google/oauth2/auth"
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: practiceexams-auth-errors
  namespace: practiceexams-auth
spec:
  errors:
    status:
      - "401"
    service:
      name: practiceexams-auth-picker
      port: 80
    query: "/"

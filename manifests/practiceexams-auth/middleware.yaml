# Shared auth gate for every practiceexams.joysontech.com app. Chained as
# [practiceexams-auth, practiceexams-auth-errors] on each protected
# IngressRoute: the forwardAuth checks the session cookie against
# oauth2-proxy-google's /auth endpoint (any instance can validate a
# session cookie regardless of which provider created it, since both
# share the same cookie secret and cookie domain); a 401 from that check
# is caught by the errors middleware and redirected to the login picker,
# preserving the originally requested URL as ?rd=.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: practiceexams-auth
  namespace: practiceexams-auth
spec:
  forwardAuth:
    address: "http://oauth2-proxy-google.practiceexams-auth.svc.cluster.local:4180/google/oauth2/auth"
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: practiceexams-auth-errors
  namespace: practiceexams-auth
spec:
  errors:
    status:
      - "401"
    service:
      name: practiceexams-auth-picker
      port: 80
    query: "/?rd={url}"

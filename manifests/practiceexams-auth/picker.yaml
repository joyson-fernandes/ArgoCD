apiVersion: v1
kind: ConfigMap
metadata:
  name: practiceexams-auth-picker
  namespace: practiceexams-auth
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Sign in — Practice Exams</title>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
      <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
          margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
          background: #08090d; color: #edeff3; font-family: 'Inter', system-ui, sans-serif;
        }
        .card {
          width: 100%; max-width: 360px; padding: 40px 32px; border-radius: 16px;
          background: #101319; border: 1px solid #212633; text-align: center;
        }
        .mark {
          width: 44px; height: 44px; border-radius: 12px; margin: 0 auto 20px;
          background: linear-gradient(135deg, #5b8def, #8b5cf6);
        }
        h1 { font-size: 18px; margin: 0 0 6px; }
        p.sub { color: #8991a3; font-size: 13.5px; margin: 0 0 28px; }
        a.btn {
          display: flex; align-items: center; justify-content: center; gap: 10px;
          width: 100%; padding: 11px 16px; margin-bottom: 12px; border-radius: 10px;
          border: 1px solid #212633; background: #161a23; color: #edeff3;
          font-size: 14px; font-weight: 600; text-decoration: none;
          transition: border-color 0.15s;
        }
        a.btn:hover { border-color: #34405c; }
        a.btn svg { width: 18px; height: 18px; flex-shrink: 0; }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="mark"></div>
        <h1>Sign in to Practice Exams</h1>
        <p class="sub">Certification practice, gated to approved accounts.</p>
        <a class="btn" id="google-btn" href="#">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </a>
        <a class="btn" id="microsoft-btn" href="#">
          <svg viewBox="0 0 24 24"><rect x="2" y="2" width="9" height="9" fill="#F25022"/><rect x="13" y="2" width="9" height="9" fill="#7FBA00"/><rect x="2" y="13" width="9" height="9" fill="#00A4EF"/><rect x="13" y="13" width="9" height="9" fill="#FFB900"/></svg>
          Continue with Microsoft
        </a>
      </div>
      <script>
        // Traefik's errors middleware appends the originally requested URL
        // as ?rd=<url> when it redirects an unauthenticated visitor here.
        // Forward it through to each provider's /oauth2/start so oauth2-proxy
        // sends the user back to whatever page they actually wanted.
        var params = new URLSearchParams(window.location.search);
        var rd = params.get('rd') || 'https://practiceexams.joysontech.com/';
        document.getElementById('google-btn').href =
          '/google/oauth2/start?rd=' + encodeURIComponent(rd);
        document.getElementById('microsoft-btn').href =
          '/microsoft/oauth2/start?rd=' + encodeURIComponent(rd);
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: practiceexams-auth-picker
  namespace: practiceexams-auth
  labels:
    app: practiceexams-auth-picker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: practiceexams-auth-picker
  template:
    metadata:
      labels:
        app: practiceexams-auth-picker
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: practiceexams-auth-picker
---
apiVersion: v1
kind: Service
metadata:
  name: practiceexams-auth-picker
  namespace: practiceexams-auth
spec:
  selector:
    app: practiceexams-auth-picker
  ports:
    - name: http
      port: 80
      targetPort: http

apiVersion: v1
kind: ConfigMap
metadata:
  name: practiceexams-auth-picker
  namespace: practiceexams-auth
data:
  index.html: |
    <!doctype html>
    <html lang="en" data-theme="dark">
    <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Practice Exams</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root, [data-theme="dark"] {
        --accent-line: #2c5c94;
        --bg: #0a0d13;
        --panel: #11151d;
        --panel-2: #171c26;
        --line: #262d3a;
        --text: #e7e9ee;
        --text-dim: #8b93a3;
        --blue: #6bafe8;
      }
      [data-theme="light"] {
        --accent-line: #0b2545;
        --bg: #f3f6f9;
        --panel: #ffffff;
        --panel-2: #f3f6f9;
        --line: #dbe2ea;
        --text: #17202b;
        --text-dim: #5c6b7a;
        --blue: #0068b3;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Public Sans', system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: 24px;
        transition: background-color 0.15s ease, color 0.15s ease;
      }
      .theme-toggle {
        position: fixed; top: 20px; right: 20px;
        width: 36px; height: 36px; border-radius: 0;
        border: 1px solid var(--line); background: var(--panel); color: var(--text-dim);
        display: flex; align-items: center; justify-content: center; cursor: pointer;
      }
      .theme-toggle:hover { color: var(--text); border-color: var(--blue); }
      .theme-toggle svg { width: 17px; height: 17px; }
      [data-theme="light"] .icon-moon, [data-theme="dark"] .icon-sun { display: none; }
      .card {
        width: 100%; max-width: 400px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-top: 4px solid var(--accent-line);
        padding: 38px 34px 32px;
      }
      .eyebrow {
        font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
        color: var(--blue); text-transform: uppercase; margin-bottom: 14px;
      }
      h1 {
        font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 24px;
        margin: 0 0 10px; letter-spacing: -0.01em; color: var(--text);
      }
      p.sub { color: var(--text-dim); font-size: 14px; line-height: 1.6; margin: 0 0 28px; }
      .providers { display: flex; flex-direction: column; gap: 10px; }
      a.btn {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        width: 100%; padding: 12px 16px;
        border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 14px; font-weight: 500; text-decoration: none;
        transition: border-color 0.15s, background-color 0.15s;
      }
      a.btn:hover { border-color: var(--blue); }
      a.btn svg.provider { width: 18px; height: 18px; flex-shrink: 0; }
      .meta {
        margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line);
        font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim);
        display: flex; justify-content: space-between;
      }
    </style>
    </head>
    <body>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="card">
        <div class="eyebrow">Authentication Required</div>
        <h1>Sign in to Practice Exams</h1>
        <p class="sub">Certification practice on real Kubernetes clusters. Sign in with an approved identity provider to continue.</p>

        <div class="providers">
          <a class="btn" id="google-btn" href="#">
            <svg class="provider" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continue with Google
          </a>
          <a class="btn" id="microsoft-btn" href="#">
            <svg class="provider" viewBox="0 0 24 24"><rect x="2" y="2" width="9" height="9" fill="#F25022"/><rect x="13" y="2" width="9" height="9" fill="#7FBA00"/><rect x="2" y="13" width="9" height="9" fill="#00A4EF"/><rect x="13" y="13" width="9" height="9" fill="#FFB900"/></svg>
            Continue with Microsoft
          </a>
        </div>

        <div class="meta">
          <span>practiceexams.joysontech.com</span>
          <span>TLS secured</span>
        </div>
      </div>
      <script>
        try {
          var saved = localStorage.getItem('pe-theme');
          if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
        document.getElementById('theme-toggle').addEventListener('click', function() {
          var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', next);
          try { localStorage.setItem('pe-theme', next); } catch (e) {}
        });

        var rd = window.location.href.indexOf('auth.practiceexams.joysontech.com') === -1
          ? window.location.href
          : 'https://practiceexams.joysontech.com/';
        document.getElementById('google-btn').href =
          'https://auth.practiceexams.joysontech.com/google/oauth2/start?rd=' + encodeURIComponent(rd);
        document.getElementById('microsoft-btn').href =
          'https://auth.practiceexams.joysontech.com/microsoft/oauth2/start?rd=' + encodeURIComponent(rd);
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: practiceexams-auth-picker
  namespace: practiceexams-auth
  labels:
    app: practiceexams-auth-picker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: practiceexams-auth-picker
  template:
    metadata:
      labels:
        app: practiceexams-auth-picker
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: practiceexams-auth-picker
---
apiVersion: v1
kind: Service
metadata:
  name: practiceexams-auth-picker
  namespace: practiceexams-auth
spec:
  selector:
    app: practiceexams-auth-picker
  ports:
    - name: http
      port: 80
      targetPort: http

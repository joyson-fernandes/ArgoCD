apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-dns-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  hubble-dns.json: |
    {
      "uid": "hubble-dns",
      "title": "Hubble DNS",
      "tags": [
        "cilium",
        "hubble",
        "dns"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "All queries / s",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "noValue": "0"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "expr": "sum(rate(hubble_dns_queries_total{source_namespace=~\"$namespace\"}[5m]))",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "External queries / s",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "noValue": "0"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "expr": "sum(rate(hubble_dns_queries_total{source_namespace=~\"$namespace\",query!~\".*cluster\\\\.local\\\\.?\"}[5m]))",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "NXDOMAIN / s (external names)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "noValue": "0"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "expr": "sum(rate(hubble_dns_responses_total{rcode=\"Non-Existent Domain\",query!~\".*cluster\\\\.local\\\\.?\"}[5m]))",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Server failures / s",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "noValue": "0"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "expr": "sum(rate(hubble_dns_responses_total{rcode=\"Server Failure\"}[5m]))",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Queries / s by namespace",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by(source_namespace)(rate(hubble_dns_queries_total{source_namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "{{source_namespace}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "External queries / s by namespace",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by(source_namespace)(rate(hubble_dns_queries_total{source_namespace=~\"$namespace\",query!~\".*cluster\\\\.local\\\\.?\"}[5m]))",
              "legendFormat": "{{source_namespace}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Responses / s by rcode (all names)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by(rcode)(rate(hubble_dns_responses_total[5m]))",
              "legendFormat": "{{rcode}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "NXDOMAIN / s by name (external)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "topk(10,sum by(query)(rate(hubble_dns_responses_total{rcode=\"Non-Existent Domain\",query!~\".*cluster\\\\.local\\\\.?\"}[5m])))",
              "legendFormat": "{{query}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "type": "table",
          "title": "Top external names (selected range)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 24,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "sortBy": [
              {
                "displayName": "Queries",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "Queries"
                }
              }
            }
          ],
          "targets": [
            {
              "expr": "topk(20,sum by(source_namespace,query)(increase(hubble_dns_queries_total{source_namespace=~\"$namespace\",query!~\".*cluster\\\\.local\\\\.?\"}[$__range])))",
              "instant": true,
              "format": "table",
              "refId": "A"
            }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(hubble_dns_queries_total, source_namespace)",
              "refId": "ns"
            },
            "definition": "label_values(hubble_dns_queries_total, source_namespace)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      }
    }

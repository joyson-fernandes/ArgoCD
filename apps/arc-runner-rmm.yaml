apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-rmm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: "0.14.2"
    helm:
      releaseName: rmm
      valuesObject:
        githubConfigUrl: https://github.com/joyson-fernandes/rmm
        # The same GitHub App as the portfolio runner: it must be allowed to see this repository.
        githubConfigSecret: arc-github-app-secret
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-controller-gha-rs-controller
        runnerScaleSetName: rmm-k8s
        # One runner kept warm so a job starts in seconds instead of minutes; up to three at once.
        minRunners: 1
        maxRunners: 3
        # The Go tests start Postgres in Docker (testcontainers) and the image build
        # needs a Docker daemon, so this runner brings its own (docker-in-docker).
        containerMode:
          type: "dind"
        # A node-local build cache (Go, npm) shared by the runner pods on a node, so repeat builds
        # skip compiling the standard library for every target from scratch.
        template:
          spec:
            initContainers:
              - name: ci-cache-perms
                image: busybox:1.36
                command: ["sh", "-c", "mkdir -p /ci-cache && chmod 0777 /ci-cache"]
                volumeMounts:
                  - name: ci-cache
                    mountPath: /ci-cache
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:latest
                command: ["/home/runner/run.sh"]
                env:
                  - name: GOCACHE
                    value: /ci-cache/go-build
                  - name: GOMODCACHE
                    value: /ci-cache/go-mod
                  - name: npm_config_cache
                    value: /ci-cache/npm
                volumeMounts:
                  - name: ci-cache
                    mountPath: /ci-cache
            volumes:
              - name: ci-cache
                hostPath:
                  path: /var/lib/rmm-ci-cache
                  type: DirectoryOrCreate

  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-rmm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: "0.14.2"
    helm:
      releaseName: rmm
      valuesObject:
        githubConfigUrl: https://github.com/joyson-fernandes/rmm
        # The same GitHub App as the portfolio runner: it must be allowed to see this repository.
        githubConfigSecret: arc-github-app-secret
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-controller-gha-rs-controller
        runnerScaleSetName: rmm-k8s
        # Two runners kept warm so two commits pushed close together don't queue behind each other
        # waiting for a job to finish before the next can even start; at most two at once.
        minRunners: 2
        maxRunners: 2
        # Docker-in-docker, written out in full (the chart's containerMode shortcut cannot be
        # customised): the Go tests start Postgres in Docker and the image build needs a daemon.
        # A node-local build cache (Go, npm) is shared by the runner pods on a node, so repeat
        # builds skip compiling the standard library for every target from scratch.
        template:
          spec:
            # CI runs on prod-k8s-w02 (nearly idle). That node is tainted for kubevirt, so the runner pods tolerate
            # the taint; the affinity is a preference, so CI can still fall back to another worker if w02 is down.
            # It used to run on prod-k8s-w03, which dropped out (NodeNotReady) under parallel CI load.
            tolerations:
              - key: workload
                operator: Equal
                value: kubevirt
                effect: NoSchedule
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values: ["prod-k8s-w02"]
            initContainers:
              - name: init-dind-externals
                image: ghcr.io/actions/actions-runner:latest
                command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
                volumeMounts:
                  - name: dind-externals
                    mountPath: /home/runner/tmpDir
              - name: ci-cache-perms
                image: busybox:1.36
                command: ["sh", "-c", "mkdir -p /ci-cache && chmod 0777 /ci-cache"]
                volumeMounts:
                  - name: ci-cache
                    mountPath: /ci-cache
              - name: dind
                image: docker:dind
                args:
                  - dockerd
                  - --host=unix:///var/run/docker.sock
                  - --group=$(DOCKER_GROUP_GID)
                env:
                  - name: DOCKER_GROUP_GID
                    value: "123"
                securityContext:
                  privileged: true
                restartPolicy: Always
                startupProbe:
                  exec:
                    command: ["docker", "info"]
                  initialDelaySeconds: 0
                  failureThreshold: 24
                  periodSeconds: 5
                # Image builds run here. The limit stops one build from OOMing the whole node. 4Gi (prod-k8s-w02 has 16GB since 2026-11-16), and at most 2 runners: prod-k8s-w03 (8GB) dropped out (NodeNotReady) when parallel CI jobs starved it, killing the jobs on it.
                resources:
                  requests:
                    cpu: 250m
                    memory: 256Mi
                  limits:
                    memory: 4Gi
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
                  - name: dind-externals
                    mountPath: /home/runner/externals
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:latest
                command: ["/home/runner/run.sh"]
                env:
                  - name: DOCKER_HOST
                    value: unix:///var/run/docker.sock
                  - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                    value: "120"
                  - name: GOCACHE
                    value: /ci-cache/go-build
                  - name: GOMODCACHE
                    value: /ci-cache/go-mod
                  - name: npm_config_cache
                    value: /ci-cache/npm
                # Go race tests, the VMware simulator and fake S3 need more than 2Gi (OOMKilled on 2026-11-15); 6Gi since W02 went to 16GB.
                # 4Gi runner + 3Gi dind on a ~8Gi node: a test job and an image build can share w02.
                resources:
                  requests:
                    cpu: 250m
                    memory: 1Gi
                  limits:
                    memory: 6Gi
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
                  - name: ci-cache
                    mountPath: /ci-cache
            volumes:
              - name: work
                emptyDir: {}
              - name: dind-sock
                emptyDir: {}
              - name: dind-externals
                emptyDir: {}
              - name: ci-cache
                hostPath:
                  path: /var/lib/rmm-ci-cache
                  type: DirectoryOrCreate

  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

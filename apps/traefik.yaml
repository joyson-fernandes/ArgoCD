apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  sources:

    # Traefik Helm chart
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 38.0.0
      helm:
        valueFiles:
          - $values/values/traefik/values.yaml

    # Kubernetes manifests
    - repoURL: https://github.com/joyson-fernandes/ArgoCD.git
      targetRevision: HEAD
      path: manifests/traefik

    # Git repository containing Helm values
    - repoURL: https://github.com/joyson-fernandes/ArgoCD.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
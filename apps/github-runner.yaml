apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-runner
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners

  sources:
    - repoURL: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
      targetRevision: latest
      helm:
        releaseName: portfolio-runner
        valueFiles:
          - $values/manifests/github-runner/values.yaml

    - repoURL: https://github.com/joyson-fernandes/ArgoCD.git
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
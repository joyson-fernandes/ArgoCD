apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-monitoring
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/joyson-fernandes/ArgoCD.git
    targetRevision: main
    path: manifests/kyverno-monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
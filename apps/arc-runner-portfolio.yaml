apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-portfolio
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: "0.14.2"
    helm:
      releaseName: portfolio
      valuesObject:
        githubConfigUrl: https://github.com/joyson-fernandes/portfolio-website-v2
        githubConfigSecret: arc-github-app-secret
        # Explicit instead of label-discovered — ArgoCD's helm-template
        # rendering can't do a live lookup for the controller's SA.
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-controller-gha-rs-controller
        runnerScaleSetName: portfolio-k8s
        minRunners: 0
        maxRunners: 3
        template:
          spec:
            serviceAccountName: arc-runner-portfolio
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:latest
                command: ["/home/runner/run.sh"]
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                  limits:
                    cpu: "1"
                    memory: 1Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/joyson-fernandes/ArgoCD.git
    targetRevision: HEAD
    path: manifests/cert-manager

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
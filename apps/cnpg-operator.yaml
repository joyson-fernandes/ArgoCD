apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.0
    helm:
      values: |
        # CRDs applied once, directly, via `kubectl apply --server-side`
        # (see manifests/cnpg-operator/README.md) — even with
        # ServerSideApply=true at the Application level, ArgoCD kept
        # hitting "metadata.annotations: Too long: may not be more than
        # 262144 bytes" on the Cluster CRD specifically (confirmed live,
        # reproducibly). CRDs change rarely enough that managing them
        # outside GitOps for this one operator is a reasonable tradeoff.
        crds:
          create: false

  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Cluster CRD is large enough to exceed client-side apply's
      # annotation size limit — confirmed live: it silently failed to
      # install (operator crash-looped on "no matches for kind Cluster")
      # while the other 8 smaller CRDs installed fine.
      - ServerSideApply=true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-proxy-manager
  namespace: nginx-proxy-manager
spec:
  replicas: 1
  selector:
    matchLabels: { app: npm }
  template:
    metadata:
      labels: { app: npm }
    spec:
      containers:
        - name: npm
          image: jc21/nginx-proxy-manager:latest
          ports:
            - containerPort: 80
            - containerPort: 81
            - containerPort: 443
          volumeMounts:
            - name: data
              mountPath: /data
            - name: letsencrypt
              mountPath: /etc/letsencrypt
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: npm-data }
        - name: letsencrypt
          persistentVolumeClaim: { claimName: npm-letsencrypt }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-proxy-manager
  namespace: nginx-proxy-manager
spec:
  type: LoadBalancer
  selector:
    app: npm
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-proxy-manager-admin
  namespace: nginx-proxy-manager
spec:
  type: NodePort
  selector:
    app: npm
  ports:
    - name: admin
      port: 81
      targetPort: 81